[project]
name = "prime-agent-skill-web-search"
version = "0.1.0"
description = "DuckDuckGo search skill for Prime Agent"
requires-python = ">=3.10"
dependencies = ["ddgs"]

[project.scripts]
web_search = "web_search.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_search"]
